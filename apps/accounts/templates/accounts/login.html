{% extends 'base.html' %}

{% block title %}로그인 - 가계부{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-custom">
            <h1 class="mb-4 text-center" style="color: #667eea;">로그인</h1>
            
            <form method="POST">
                {% csrf_token %}
                {% include 'include/form.html' %}
                
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary-custom btn-lg w-100">로그인</button>
                </div>
            </form>
            
            <div class="text-center mt-3">
                <p class="text-muted">계정이 없으신가요? 
                    <a href="{% url 'accounts:signup' %}">회원가입</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
